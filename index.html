<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reaction Test</title>

  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      color: #b026ff;
    }

    #box {
      width: 200px;
      height: 200px;
      background: #222;
      margin: 30px auto;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }

    #box.ready {
      background: #b026ff;
      box-shadow: 0 0 20px #b026ff;
    }

    button {
      padding: 10px 20px;
      background: #b026ff;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>⚡ Reaction Test</h1>
  <p>Klik kotak saat berubah warna!</p>

  <div id="box">Tunggu...</div>

  <button onclick="start()">Mulai</button>

  <p id="result"></p>

  <script>
    let startTime, endTime;
    let timeout;

    function start() {
      let box = document.getElementById("box");
      let result = document.getElementById("result");

      box.classList.remove("ready");
      box.innerHTML = "Tunggu...";
      result.innerHTML = "";

      let delay = Math.random() * 3000 + 2000;

      timeout = setTimeout(() => {
        box.classList.add("ready");
        box.innerHTML = "KLIK!";
        startTime = new Date().getTime();
      }, delay);
    }

    document.getElementById("box").onclick = function () {
      let box = document.getElementById("box");
      let result = document.getElementById("result");

      if (!box.classList.contains("ready")) {
        clearTimeout(timeout);
        result.innerHTML = "❌ Kepencet duluan!";
        return;
      }

      endTime = new Date().getTime();
      let reaction = endTime - startTime;

      result.innerHTML = "⚡ Reaksi lu: " + reaction + " ms";

      box.classList.remove("ready");
      box.innerHTML = "Ulangi?";
    };
  </script>

</body>
</html>
